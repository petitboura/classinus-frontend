# Numéros de version de l'appli Android : le SEUL endroit à modifier avant de
# fabriquer un nouvel APK (Android Studio : ouvrir ce fichier, changer les deux
# valeurs, enregistrer, puis fabriquer).
#
# versionName : identique à l'étiquette de la release GitHub, sans le "v"
#   (étiquette v1.6.0 = versionName 1.6.0). C'est ce numéro que le bandeau
#   "Version X disponible" compare avec la dernière release publiée.
# versionCode : un entier qui doit AUGMENTER à chaque APK publié (sinon Android
#   refuse l'installation par-dessus). Doit rester supérieur ou égal à
#   versionNativeMin de ota.config.json.
#
# Ne mettre ni guillemets ni espaces autour des valeurs.
versionName=1.5.0
versionCode=4
