name: Publier l'appli PC (Windows)

# Construit l'installeur Windows de Classinus (Electron) et le publie dans une
# release du dépôt public petitboura/classinus-updates-pc. L'appli installée lit ces
# releases pour se mettre à jour toute seule (voir
# packages/capacitor-mise-a-jour-pc-electron et la section "Appli PC" du README).
#
# Déclenchement : uniquement en poussant une étiquette de la forme pc-vX.Y.Z
# (par exemple pc-v0.1.0). Jamais à chaque push sur main : la publication de
# l'appli PC est un geste volontaire, séparé de l'OTA mobile (ota.yml).
#
# Garde-fous :
# - l'étiquette doit pointer un commit déjà contenu dans main ;
# - le build utilise les variables de PRODUCTION (les mêmes que ota.yml), et
#   refuse une adresse de backend contenant "staging" ;
# - CLASSINUS_CIBLE_TEST est neutralisé, donc la cible de test de
#   next.config.mjs ne peut pas s'appliquer ici.
# - le relais téléphone (Relais-Class-Tech.exe) est CONSTRUIT pendant le
#   workflow depuis le dépôt class-tech (Python + PyInstaller, 28/10/2026,
#   décision D31 : relais embarqué), puis posé dans electron/relais-dist, d'où
#   electron-builder l'embarque dans l'installeur (extraResources). Il faut
#   donc aussi le secret CLASS_TECH_LECTURE (lecture seule du dépôt class-tech),
#   en plus de PC_RELEASES_TOKEN ;
# - la release est créée en BROUILLON avant electron-builder, et RESTE en
#   brouillon à la fin (invisible pour les utilisateurs) : publication manuelle
#   uniquement après test et validation de Bourama. Sans cela,
#   electron-builder envoyait les fichiers en parallèle et chacun tentait de créer
#   la release : GitHub refusait (erreur 422) ou créait deux releases du même nom,
#   et latest.yml devenait introuvable pour les appareils installés.

on:
  push:
    tags:
      - "pc-v*"

# Une publication à la fois, sans en annuler en cours de route.
concurrency:
  group: pc-publication
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publier:
    runs-on: windows-latest
    timeout-minutes: 45

    env:
      CAPACITOR_BUILD: "true"
      CLASSINUS_CIBLE_TEST: ""
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
      PC_RELEASES_TOKEN: ${{ secrets.PC_RELEASES_TOKEN }}
      CLASS_TECH_LECTURE: ${{ secrets.CLASS_TECH_LECTURE }}

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Vérifier l'étiquette et la branche
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#pc-v}"
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Étiquette invalide : $GITHUB_REF_NAME. Forme attendue : pc-v1.2.3"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Le commit de l'étiquette n'est pas dans main. On ne publie l'appli PC que depuis main."
            exit 1
          fi
          echo "VERSION_PC=$version" >> "$GITHUB_ENV"
          echo "Version publiée : $version"

      - name: Vérifier la configuration
        shell: bash
        run: |
          manquantes=""
          for nom in NEXT_PUBLIC_API_URL NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY NEXT_PUBLIC_APP_URL PC_RELEASES_TOKEN CLASS_TECH_LECTURE; do
            if [ -z "${!nom}" ]; then
              manquantes="$manquantes $nom"
            fi
          done
          if [ -n "$manquantes" ]; then
            echo "Configuration incomplète. Variables ou secrets manquants :$manquantes"
            echo "À renseigner dans Settings, Secrets and variables, Actions."
            exit 1
          fi
          case "$NEXT_PUBLIC_API_URL" in
            *staging*)
              echo "NEXT_PUBLIC_API_URL vise le staging. Une publication PC doit viser la production."
              exit 1
              ;;
          esac

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Construire le site pour l'appli PC (export statique)
        run: npx next build

      # Relais téléphone embarqué : récupéré puis construit ici, jamais versionné
      # (28/10/2026, décision D31). Le script relais/construire_exe.py de class-tech
      # produit dist-1clic/Relais-Class-Tech.exe ; on le pose avec les réglages par
      # défaut dans electron/relais-dist, d'où electron-builder l'embarque dans
      # l'installeur (extraResources vers resources/relais).
      - name: Récupérer le relais (dépôt class-tech)
        uses: actions/checkout@v4
        with:
          repository: petitboura/class-tech
          ref: main
          path: class-tech
          token: ${{ secrets.CLASS_TECH_LECTURE }}

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Construire le relais téléphone
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install -r class-tech/backend/requirements.txt
          python class-tech/relais/construire_exe.py
          mkdir -p electron/relais-dist
          cp class-tech/dist-1clic/Relais-Class-Tech.exe electron/relais-dist/
          cp class-tech/relais/reglages.json electron/relais-dist/
          echo "Relais embarqué :"
          ls -la electron/relais-dist

      # Ordre important : les plugins doivent être compilés AVANT `cap sync`.
      # `cap sync` ne retient que les plugins dont le fichier compilé
      # (electron/dist/plugin.mjs) existe déjà, et ignore les autres sans
      # erreur. Dans l'ordre inverse, l'installeur sortait sans aucun plugin
      # (superposition, pont natif, dossiers, mise à jour automatique, relais).
      - name: Compiler les plugins Electron
        shell: bash
        run: |
          npm --prefix packages/capacitor-dossiers-electron run build
          npm --prefix packages/capacitor-pont-natif-electron run build
          npm --prefix packages/capacitor-superposition-electron run build
          npm --prefix packages/capacitor-mise-a-jour-pc-electron run build
          npm --prefix packages/capacitor-relais-pc-electron run build

      - name: Synchroniser le projet Electron
        run: npx cap sync @capawesome/capacitor-electron

      - name: Installer les dépendances d'Electron
        working-directory: electron
        run: npm ci

      - name: Compiler et préparer l'appli Electron
        working-directory: electron
        shell: bash
        run: |
          npm run build
          npx capacitor-electron vendor

      # Étape 1 : créer la release en brouillon, UNE seule fois, avant que
      # electron-builder n'envoie quoi que ce soit. electron-builder cherche une
      # release à l'étiquette vX.Y.Z (brouillons compris) et la réutilise : tous ses
      # envois en parallèle arrivent alors dans la même release.
      - name: Préparer la release en brouillon
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PC_RELEASES_TOKEN }}
          DEPOT_RELEASES: petitboura/classinus-updates-pc
        run: |
          tag="v$VERSION_PC"
          existantes=$(gh api "repos/$DEPOT_RELEASES/releases?per_page=100" --jq "[.[] | select(.tag_name==\"$tag\")] | length")
          if [ "$existantes" != "0" ]; then
            echo "Une release $tag existe déjà dans $DEPOT_RELEASES. Rien n'est publié : supprimer cette release (et son étiquette si besoin) ou choisir un autre numéro."
            exit 1
          fi
          id=$(gh api -X POST "repos/$DEPOT_RELEASES/releases" -f tag_name="$tag" -f name="$VERSION_PC" -F draft=true -F prerelease=false --jq '.id')
          if [ -z "$id" ]; then
            echo "Impossible de créer la release brouillon."
            exit 1
          fi
          echo "ID_RELEASE_PC=$id" >> "$GITHUB_ENV"
          echo "Release brouillon créée : $tag (id $id)"

      - name: Construire et envoyer l'installeur Windows
        working-directory: electron
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PC_RELEASES_TOKEN }}
        run: |
          npx electron-builder --config electron-builder.config.js --win --publish always -c.extraMetadata.version="$VERSION_PC"
          echo "Fichiers produits :"
          ls -la dist

      # Étape 3 : vérifier que tout est là, sans publier. La release reste en
      # brouillon tant que Bourama n'a pas testé et donné son accord.
      - name: Vérifier le brouillon sans publier
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PC_RELEASES_TOKEN }}
          DEPOT_RELEASES: petitboura/classinus-updates-pc
        run: |
          tag="v$VERSION_PC"
          exe="Classinus-Setup-$VERSION_PC.exe"
          memes=$(gh api "repos/$DEPOT_RELEASES/releases?per_page=100" --jq "[.[] | select(.tag_name==\"$tag\")] | length")
          if [ "$memes" != "1" ]; then
            echo "Il y a $memes releases à l'étiquette $tag au lieu d'une seule. Publication annulée."
            exit 1
          fi
          for fichier in "$exe" "latest.yml"; do
            etat=$(gh api "repos/$DEPOT_RELEASES/releases/$ID_RELEASE_PC" --jq ".assets[] | select(.name==\"$fichier\") | .state")
            if [ "$etat" != "uploaded" ]; then
              echo "Le fichier $fichier est absent ou incomplet dans la release (état : '$etat'). Publication annulée."
              exit 1
            fi
          done
          echo "Release $tag vérifiée et laissée en BROUILLON (invisible pour les utilisateurs)."
          echo "Publication manuelle uniquement après test et validation de Bourama."

      # Contrôle final : la release doit toujours être un brouillon invisible.
      # On ne contrôle plus l'adresse publique latest/download : elle sert
      # encore la version précédente tant que Bourama n'a pas publié.
      - name: Contrôler le brouillon (invisible pour les utilisateurs)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PC_RELEASES_TOKEN }}
          DEPOT_RELEASES: petitboura/classinus-updates-pc
        run: |
          brouillon=$(gh api "repos/$DEPOT_RELEASES/releases/$ID_RELEASE_PC" --jq '.draft')
          if [ "$brouillon" != "true" ]; then
            echo "La release v$VERSION_PC n'est plus en brouillon. Arrêt."
            exit 1
          fi
          echo "Brouillon v$VERSION_PC confirmé invisible pour les utilisateurs."

      # En cas d'échec avant la publication : supprimer le brouillon, pour qu'une
      # relance du même numéro reparte propre. Une release déjà publiée n'est jamais touchée.
      - name: Nettoyer le brouillon en cas d'échec
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PC_RELEASES_TOKEN }}
          DEPOT_RELEASES: petitboura/classinus-updates-pc
        run: |
          if [ -z "$ID_RELEASE_PC" ]; then
            echo "Aucun brouillon à nettoyer."
            exit 0
          fi
          brouillon=$(gh api "repos/$DEPOT_RELEASES/releases/$ID_RELEASE_PC" --jq '.draft' || echo "")
          if [ "$brouillon" = "true" ]; then
            gh api -X DELETE "repos/$DEPOT_RELEASES/releases/$ID_RELEASE_PC"
            echo "Brouillon supprimé (id $ID_RELEASE_PC)."
          else
            echo "La release n'est plus un brouillon, elle n'est pas touchée."
          fi
