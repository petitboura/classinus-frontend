name: Lecture PC Windows
on:
  push:
    branches: [feature/canal-en-direct-pc]
  pull_request:
    branches: [feature/canal-en-direct-pc]
  workflow_dispatch:
jobs:
  lecture-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npx tsc -p electron/tsconfig.json --noEmit
      - run: npx tsc -p packages/capacitor-pont-natif-electron/electron/tsconfig.json --noEmit
      - run: node tests/verifier-uia-windows.mjs
      - run: npm run test:pointage-ecran
      - run: node tests/verifier-clic-ecran.mjs
      - run: node node_modules/electron/install.js
      - run: npm --prefix packages/capacitor-dossiers-electron run build
      - run: npm --prefix packages/capacitor-pont-natif-electron run build
      - run: npm --prefix packages/capacitor-superposition-electron run build
      - run: node tests/verifier-pont-electron.mjs
