name: Internationalization checks

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typescript:
    name: Frontend TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test interface localization
        run: npm run test:i18n
      - name: Audit remaining interface strings
        run: npm run audit:i18n
      - name: Test incoming app links remain intact
        run: npm run test:liens-entrants
      - name: Test API empty-response handling
        run: node tests/verifier-reponse-api.mjs
      - name: Test user-facing error handling
        run: npm run test:gestion-erreurs
      - name: Type-check the application
        run: npx tsc --noEmit
